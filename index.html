    <body>
        <br><br>
    <header>
        <h1>OBMC Student Enrollment Form</h1>
        <img src="https://files.orangeapps.ph/disk001/School_Files/1/school-65/school_profile/1784985566-2021.png" alt="school logo">
        <p>Kindly fill out the form below to secure enrollment for the upcoming school year.</p>
    </header>
    <br>

    <div class="container1">
        <div class="container2">
            <form action="">

            <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                <div style="flex: 1;">
                 <label for="fname">First Name</label><br>
                 <input type="text" id="fname" name="fname" placeholder="Juan" required>
               </div>
            <div style="flex: 1;">
                 <label for="lname">Last Name</label><br>
                 <input type="text" id="lname" name="lname" placeholder="Dela Cruz" required>
               </div>
    </div>
<br>

                <label for="bday">Birth Date</label><br>
                <input type="text" id="birthdate" name="birthdate" placeholder="mm/dd/yy" required> 
                <br><br>

                <label for="email">Email Address</label><br>
                <input type="text" id="email" name="email" placeholder="cruz.jd@obmontessori.edu.ph" required> 
                <br><br>

                <label for="phone number">Phone Number</label><br>
                <input type="text" id="phone number" name="phone number" placeholder="0000-000-0000" required> 
                <br><br>

                <label>Gender</label><br>
                <input type="radio" id="male" name="gender" value="Male"> <label for="male">Male</label><br>
                <input type="radio" id="female" name="gender" value="Female"> <label for="female">Female</label><br>
                <br><br>

                <label for="grade-level">Choose Grade Level:</label>
                <select id="grade-level" name="Grade Level">
                    <option>Choose a grade level</option>
                    <option value="Grade 1">Grade 1</option>
                    <option value="Grade 2">Grade 2</option>
                    <option value="Grade 3">Grade 3</option>
                    <option value="Grade 4">Grade 4</option>
                    <option value="Grade 5">Grade 5</option>
                    <option value="Grade 6">Grade 6</option>
                    <option value="Grade 7">Grade 7</option>
                    <option value="Grade 8">Grade 8</option>
                    <option value="Grade 9">Grade 9</option>
                    <option value="Grade 10">Grade 10</option>
                    <option value="Grade 11">Grade 11</option>
                    <option value="Grade 12">Grade 12</option>
                    
                </select>
                <br><br>
            

                <h6 class="FurtherInfo">For further information, you may visit:</h6> 
                <div style="text-align: center;">
                    <a href="https://obmontessori.edu.ph/" target="_blank">obmontessori.edu.ph</a><br>
                </div>
                <br><br>
